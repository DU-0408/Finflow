apiVersion: apps/v1
kind: Deployment
metadata:
  name: finflow-frontend
  namespace: finflow
  labels:
    app: finflow-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finflow-frontend
  template:
    metadata:
      labels:
        app: finflow-frontend
    spec:
      containers:
        - name: frontend
          image: du0408/finflow-frontend:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: finflow-config
            - secretRef:
                name: finflow-secrets
          env:
            - name: NEXTAUTH_URL
              value: "https://finflow.udhomelab.dpdns.org"
            - name: API_GATEWAY_URL
              value: "http://finflow-api-gateway:8000"
            - name: FRAUD_SERVICE_URL
              value: "http://finflow-fraud-service:8001"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://finflow-notification-service:8002"
            - name: PROMETHEUS_URL
              value: "http://finflow-prometheus:9090"
            - name: GRAFANA_URL
              value: "http://finflow-grafana:3000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: finflow-frontend
  namespace: finflow
  labels:
    app: finflow-frontend
spec:
  type: ClusterIP
  selector:
    app: finflow-frontend
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
